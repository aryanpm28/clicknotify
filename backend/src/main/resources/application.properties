# Server
server.port=8080

# MySQL Database
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3307/clicknotify?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Brevo
brevo.api-key=${BREVO_API_KEY}
brevo.from-email=${BREVO_FROM_EMAIL}

# Telegram Bot
telegram.bot.token=${TELEGRAM_BOT_TOKEN:your_telegram_bot_token}
telegram.bot.username=${TELEGRAM_BOT_USERNAME:your_bot_username}

# CORS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# API key
security.api-key=${API_KEY:dev-only-placeholder-key}

# Rate limit
security.rate-limit.max-requests=10
security.rate-limit.window-seconds=60
