# Server
server.port=8080

# MySQL Database
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3307/clicknotify?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Mail (Gmail - use App Password)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:your_email@gmail.com}
spring.mail.password=${MAIL_APP_PASSWORD:your_gmail_app_password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Telegram Bot (from @BotFather)
telegram.bot.token=${TELEGRAM_BOT_TOKEN:your_telegram_bot_token}
# Your bot's @username, without the @ — used server-side to build the
# https://t.me/<username>?start=<token> deep link returned by POST /telegram/link.
telegram.bot.username=${TELEGRAM_BOT_USERNAME:your_bot_username}

# CORS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# API key (frontend must send X-API-Key header)
security.api-key=${API_KEY:dev-only-placeholder-key}

# Rate limit
security.rate-limit.max-requests=10
security.rate-limit.window-seconds=60
